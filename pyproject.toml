[project]
name = "csi-lab"
version = "0.1.0"
description = "Learn Wi-Fi sensing (CSI) with Python, an ESP32 pair, and an AI study buddy"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
    "matplotlib>=3.8",
    "pyserial>=3.5",
]

[project.optional-dependencies]
ml = [
    "scikit-learn>=1.4",
]
notebook = [
    "jupyterlab>=4.0",
]

[project.scripts]
csi-lab = "csi_lab.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "scikit-learn>=1.4",
    "nbformat>=5.9",
    "nbclient>=0.10",
    "ipykernel>=6.29",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/csi_lab"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "D"]
ignore = ["D203", "D213"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
# python_version is left out on purpose: numpy >= 2.3 type stubs need 3.12+, so mypy
# checks with the running Python (CI runs 3.10 and 3.13).
strict = true
ignore_missing_imports = true
